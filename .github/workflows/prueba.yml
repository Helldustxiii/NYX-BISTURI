name: Prueba BISTURI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar prueba de humo
        run: |
          set -euo pipefail
          test -d BISTURI/sistema-prompts
          test -s BISTURI/sistema-prompts/BISTURI-CHATGPT-SYSTEM-PROMPT.md
          test -s BISTURI/sistema-prompts/00-principios-bisturi.md
          echo "BISTURI: prueba de humo superada."
