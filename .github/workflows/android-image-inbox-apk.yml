name: Build NYX Android APK

on:
  push:
    branches:
      - main
      - feature/android-image-inbox-2026-11-07
      - feature/nyx-android-full-app-2026-11-08
    paths:
      - "android-bridge/**"
      - ".github/workflows/android-image-inbox-apk.yml"
  pull_request:
    branches:
      - main
      - integrate/android-bridge-2026-09-27
    paths:
      - "android-bridge/**"
      - ".github/workflows/android-image-inbox-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyx-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Make Gradle wrapper executable
        working-directory: android-bridge
        run: chmod +x ./gradlew

      - name: Run Android unit tests
        working-directory: android-bridge
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Run NYX chat CLI unit tests
        run: python -m unittest discover -s android-bridge/tests -v

      - name: Restore original NYX debug signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nyx-debug.keystore"
          chmod 600 "$RUNNER_TEMP/nyx-debug.keystore"
          keytool -list -keystore "$RUNNER_TEMP/nyx-debug.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null

      - name: Build debug APK with original signing key
        if: github.event_name != 'pull_request'
        working-directory: android-bridge
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/nyx-debug.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build pull request APK with temporary CI debug key
        if: github.event_name == 'pull_request'
        working-directory: android-bridge
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nyx-android-debug
          path: android-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
