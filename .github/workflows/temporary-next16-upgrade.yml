name: Temporary Next 16 upgrade verification

on:
  push:
    branches:
      - fix/next16-security-2026-11-22

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- package-lock.json; then
            git add package-lock.json
            git commit -m "chore(deps): regenerate lockfile for Next.js 16"
            git push
          fi

      - name: Install exact locked tree
        run: npm ci

      - name: Security audit
        shell: bash
        run: |
          set +e
          npm audit --json > audit.json
          audit_status=$?
          set -e
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities || {};
          const packages = Object.entries(report.vulnerabilities || {}).map(([name, v]) => ({
            name,
            severity: v.severity,
            direct: v.isDirect,
            range: v.range,
            fixAvailable: v.fixAvailable
          }));
          console.log(JSON.stringify({ counts, packages }, null, 2));
          if ((counts.critical || 0) > 0 || (counts.high || 0) > 0) {
            process.exitCode = 1;
          }
          NODE
          echo "npm audit exit status: $audit_status"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
